[build-system]
requires = ["uv_build>=0.8.19,<0.12.0"]
build-backend = "uv_build"

[project]
name = "proacp"
version = "0.0.0"
description = "proACP: attention-based contact planner and contact tracker for humanoid mobility (arXiv:2610.31608), trained with SuperMimic on mjlab; the Unitree G1 or your own robot."
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
readme = "README.md"
authors = [{ name = "proACP contributors" }]
requires-python = ">=3.10,<3.14"
dependencies = [
  "mjlab>=1.6.0",
  "torch>=2.7.0",
  "pillow",
]

[tool.uv]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# CUDA 12.8 torch (Blackwell-capable). The reported runs used torch 2.9.0; its Triton 3.5.0 fails to compile the fused kernels of
# the policy update on an H100 ("PassManager::run failed"), so this pins the newest torch of the cu128 index.
# mjviser 0.0.17 pulls mujoco-core 4.0.1, which overwrites the files of mujoco 3.11.0 (libmujoco.so.3.11.0 is then not found).
constraint-dependencies = ["torch==2.11.0", "warp-lang==1.16.0", "mjviser<0.0.17"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
